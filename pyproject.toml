[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-rag-sample"
version = "0.1.0"
description = "Lean incidental-PII RAG sample with a Foundry prompt agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "azure-identity>=1.21,<2",
  "azure-ai-projects==2.11.0",
  "openai==3.50.0",
  "azure-storage-blob>=12.25,<13",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11", "pyright>=1.1.400"]

[tool.setuptools.packages.find]
include = ["pii_rag*"]

[tool.setuptools.package-data]
pii_rag = ["static/*", "sample_data/**/*.txt", "sample_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["pii_rag", "scripts"]
typeCheckingMode = "standard"
